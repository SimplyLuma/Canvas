# Overrides /usr/share/xdg-desktop-portal/gnome-portals.conf.
#
# xdg-desktop-portal walks $XDG_CONFIG_HOME, /etc/xdg-desktop-portal and
# /usr/share/xdg-desktop-portal, and inside each looks for
# <desktop>-portals.conf before portals.conf. The first file it finds wins
# outright -- nothing is merged. XDG_CURRENT_DESKTOP is GNOME here, so
# /usr/share/xdg-desktop-portal/gnome-portals.conf beat a portals.conf or a
# luma-portals.conf of ours every time, and this file shipped inert.
#
# Winning therefore means owning this exact name, which also means restating
# the upstream defaults below: they are not inherited. Keep them in step with
# the GNOME package when it changes them.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.AppChooser=luma;gnome;
# Screen sharing (ADR-041): luma-portal answers ScreenCast so an application
# asking to share the screen gets Luma's picker, with live previews, instead of
# GNOME's list of window names. Remove this line and every screen sharing
# request goes back to xdg-desktop-portal-gnome with no other change.
org.freedesktop.impl.portal.ScreenCast=luma;gnome;
# Background activity (ADR-033): luma-background answers the Background
# interface so sandboxed apps follow the same allow/deny state as everything
# else. If luma-background is not installed, the portal skips the missing
# backend and uses GNOME's.
org.freedesktop.impl.portal.Background=luma-background;gnome;
